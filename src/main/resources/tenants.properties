# admin(god) db properties
god.datasource.url=${JDBC_DATABASE_URL:url}
god.datasource.username=${JDBC_DATABASE_USERNAME:user}
god.datasource.password=${JDBC_DATABASE_PASSWORD:password}
god.http.client-id=${CLIENT_ID:client-id}
# HikariCP pool configuration
god.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
god.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
god.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
god.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
god.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
god.datasource.hikari.pool-name=God-HikariPool

