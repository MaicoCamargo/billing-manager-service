spring.application.name=billing-manager-service

#PROFILE
spring.profiles.active=dev

#DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#LOGGING
logging.level.root=${ROOT_LOG_LEVEL:info}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:info}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:info}
logging.level.org.springframework.boot.actuate=off
logging.level.web=${LOG_LEVEL:debug}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


#SWAGGER
infra4u.openapi.dev-url=${OPEN_API_DEV_URL:http://localhost:8080}
infra4u.openapi.prod-url=${OPEN_API_PROD_URL:}

#SERVER PORT
server.port=${SERVER_PORT:8080}

#DEFAULT TENANT
default.tenant=${DEFAULT_TENANT:god}