name: build-and-deploy

# Roda no Forgejo Actions (runner no Alpine). Build da imagem, push para o registry do
# Forgejo e deploy via chave SSH restrita (~/source/scripts/deploy.sh no servidor).
#
# - Push em develop: builda, publica :sha e :latest e faz o deploy.
# - "Run workflow" em outra branch: builda e publica so :sha. O deploy so acontece se
#   a opcao "deploy" for marcada; :latest nunca e alterado fora de develop.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Fazer deploy desta ref no servidor? (sobe a tag do commit)"
        type: boolean
        default: false

env:
  REGISTRY: localhost:3030
  IMAGE: localhost:3030/maicocamargo.dev/billing-manager-service

jobs:
  build-and-deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Login no registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login $REGISTRY -u maicocamargo.dev --password-stdin

      - name: Build da imagem
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Push da tag do commit
        run: docker push $IMAGE:${{ github.sha }}

      - name: Atualizar :latest (somente develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

      - name: Deploy no Alpine
        if: github.ref == 'refs/heads/develop' || github.event.inputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf "%s\n" "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf "%s\n" "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes angry@192.168.31.171 "billing billing-manager-service ${{ github.sha }}"
